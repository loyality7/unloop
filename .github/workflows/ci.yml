name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          # Same Flutter as local development. A newer Flutter can require a newer Android Gradle Plugin.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Native tests and lint (both builds)
        working-directory: app/android
        run: >
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME"
          :core:test :app:testFullDebugUnitTest :app:testPlayDebugUnitTest
          :app:lintFullDebug :app:lintPlayRelease

      - name: The Google Play build keeps its promises
        working-directory: app/android
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:processPlayReleaseMainManifest
          m=$(find ../build -path '*merged_manifest/playRelease*' -name AndroidManifest.xml | head -1)
          test -n "$m"
          for banned in android.permission.INTERNET android.permission.WRITE_SECURE_SETTINGS android.permission.QUERY_ALL_PACKAGES android.permission.FOREGROUND_SERVICE PaymentGuardService; do
            if grep -q "$banned" "$m"; then echo "Play manifest must not contain $banned"; exit 1; fi
          done
